[project]
name = "proyecto1-deep"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ayalaSL", email = "iris@softlogic.com" }
]
requires-python = ">=3.9"
dependencies = [
    "joblib>=1.5.3",
    "matplotlib>=3.9.4",
    "numpy>=2.0.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.6.1",
    "torch>=2.8.0",
]

[project.scripts]
proyecto1-deep = "proyecto1_deep:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
]
